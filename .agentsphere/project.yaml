schemaVersion: 4
rationale: FastAPI skeleton with SQLite/SQLAlchemy, Jinja2 templates, health endpoint
  and pytest suite
components:
- name: app
  path: .
  toolchain:
    image: agentsphere/sandbox-polyglot
    kind: python
  verify:
  - ruff check .
  - pytest
  - pip install -r requirements.txt -q --break-system-packages
  - python -m pytest -q --tb=short
  artifacts_ignore:
  - .venv/
  - __pycache__/
  - '*.db'
  - '*.db-wal'
  - '*.db-shm'
  verifySlots:
    lint:
      command: ruff check .
      source: platform_default
    test:
      command: pytest
      source: platform_default
definition_of_done:
- ruff check . passes without errors
- python -m pytest passes without errors
- GET /health returns 200 with {"status":"ok"}
network:
  needs: []
services:
- name: web
  start: uvicorn app.main:app --host 0.0.0.0 --port 8000
  port: 8000
  health:
    http: /health
    timeoutSec: 30
  preview:
    path: /

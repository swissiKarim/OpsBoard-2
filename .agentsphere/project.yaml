schemaVersion: 4
rationale: FastAPI OpsBoard with SQLite/SQLAlchemy ORM models, status engine, incident
  CRUD/status-machine/timeline, dashboard KPIs with inline-SVG bar chart, seed command
  for demo data, service CRUD UI + REST API, search/filter/sort/pagination for lists,
  error handling (404/422/400), OpenAPI docs, pytest suite, US-07 UI shell with sidebar/header/design-system/dark-mode/accessibility,
  US-08 New Incident modal with focus trap, Esc close, toast notification, and correct
  data-testid attributes, INC-4 whitespace title validation for incident creation
components:
- name: app
  path: .
  toolchain:
    image: agentsphere/sandbox-polyglot
    kind: python
  verify:
  - ruff check .
  - pytest
  - pip install -r requirements.txt -q --break-system-packages
  - python -m pytest -q --tb=short --junitxml=.agentsphere/reports/junit.xml
  artifacts_ignore:
  - .venv/
  - __pycache__/
  - '*.db'
  - '*.db-wal'
  - '*.db-shm'
  verifySlots:
    lint:
      command: ruff check .
      source: platform_default
    test:
      command: pytest
      source: platform_default
definition_of_done:
- ruff check . passes without errors
- python -m pytest passes without errors
- GET /health returns 200 with {"status":"ok"}
- compute_service_status() correctly derives outage/degraded/operational
- POST /api/incidents creates incident with open status and recalculates service status
- POST /api/incidents with whitespace-only title returns 422 (INC-4 fix)
- POST /api/incidents/{id}/status enforces open→investigating→resolved only
- PUT /api/incidents/{id} updates title/description but not status/severity
- GET /incidents/{id} renders timeline and comment input with data-testid attributes
- GET / and GET /dashboard render dashboard with four KPI tiles
- Dashboard lists five most recently updated incidents
- SVG bar chart generated server-side by app/svg_builder.py without external libraries
- All KPI tile and chart container elements have data-testid attributes
- python -m app.seed creates exactly 6 services and 25 incidents
- Seed command is idempotent (clears and re-seeds on second run)
- GET /api/services returns paginated JSON with total, items_count, page, total_pages,
  items
- GET /api/incidents returns paginated JSON with total, items_count, page, total_pages,
  items
- GET /incidents supports q, status, severity, service_id, sort, page query params
- GET /services supports q, status, sort, page query params
- Filter and search params reflected in URL; reloading restores the same filtered
  view
- Pagination controls rendered server-side with data-testid="pagination"
- Filter form inputs have labels and data-testid attributes
- GET /services renders Jinja2 list with data-testid rows and status badges
- POST /services creates service and redirects to /services
- GET /services/{id} renders service detail page
- PUT /api/services/{id} updates name, description and team
- DELETE /api/services/{id} removes service and related incidents
- GET /api/services and POST /api/services return JSON
- GET /api/services/{id} returns 404 with JSON detail for unknown ID
- GET /api/incidents/{id} returns 404 with JSON detail for unknown ID
- POST /api/incidents with missing fields returns 422 with per-field errors
- POST /api/services with missing name returns 422 with per-field errors
- POST /api/incidents/{id}/status with backward transition returns 400 with detail
- GET /docs returns 200 and contains swagger UI
- GET /openapi.json returns valid OpenAPI schema with openapi field
- pytest tests/test_error_handling.py covers all 404, 422 and 400 cases
- Sidebar with data-testid="sidebar" and data-testid="sidebar-toggle" rendered on
  all pages
- Global search input data-testid="global-search" present in header on all pages
- CSS served from /static/css/main.css with CSS variables (--) for all colours
- Status badges display text labels (Operational/Degraded/Outage) in addition to colour
- Theme toggle data-testid="theme-toggle" in header; persists choice in localStorage
- CSS contains prefers-reduced-motion media query disabling animations
- All form inputs have associated label elements
- Empty state elements shown when lists are empty
- Tables rendered with table-card class for mobile card layout
- data-testid="btn-new-incident" present on /incidents and /dashboard pages
- data-testid="modal-new-incident" dialog with labelled inputs for title, service,
  severity, description
- Pressing Esc closes modal; JS focus trap keeps focus inside modal while open
- Submitting valid form POSTs to /api/incidents and closes modal
- data-testid="toast-incident-created" shown after successful creation
- Modal and all interactive elements carry data-testid attributes
network:
  needs: []
services:
- name: web
  start: bash -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port
    8000"
  port: 8000
  health:
    http: /health
    timeoutSec: 30
  preview:
    path: /

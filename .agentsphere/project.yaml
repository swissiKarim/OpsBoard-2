schemaVersion: 4
rationale: FastAPI OpsBoard with SQLite/SQLAlchemy ORM models, status engine, incident
  CRUD/status-machine/timeline, dashboard KPIs with inline-SVG bar chart, seed command
  for demo data, and pytest suite
components:
- name: app
  path: .
  toolchain:
    image: agentsphere/sandbox-polyglot
    kind: python
  verify:
  - ruff check .
  - pytest
  - pip install -r requirements.txt -q --break-system-packages
  - python -m pytest -q --tb=short --junitxml=.agentsphere/reports/junit.xml
  - python -m app.seed
  artifacts_ignore:
  - .venv/
  - __pycache__/
  - '*.db'
  - '*.db-wal'
  - '*.db-shm'
  verifySlots:
    lint:
      command: ruff check .
      source: platform_default
    test:
      command: pytest
      source: platform_default
definition_of_done:
- ruff check . passes without errors
- python -m pytest passes without errors
- GET /health returns 200 with {"status":"ok"}
- compute_service_status() correctly derives outage/degraded/operational
- POST /api/incidents creates incident with open status and recalculates service status
- POST /api/incidents/{id}/status enforces open→investigating→resolved only
- PUT /api/incidents/{id} updates title/description but not status/severity
- GET /incidents/{id} renders timeline and comment input with data-testid attributes
- GET / and GET /dashboard render dashboard with four KPI tiles
- Dashboard lists five most recently updated incidents
- SVG bar chart generated server-side by app/svg_builder.py without external libraries
- All KPI tile and chart container elements have data-testid attributes
- python -m app.seed creates exactly 6 services and 25 incidents
- Seed command is idempotent (clears and re-seeds on second run)
- GET /api/services returns {total, items} with total equal to service count
- GET /api/incidents returns {total, items} with total equal to incident count
network:
  needs: []
services:
- name: web
  start: bash -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port
    8000"
  port: 8000
  health:
    http: /health
    timeoutSec: 30
  preview:
    path: /

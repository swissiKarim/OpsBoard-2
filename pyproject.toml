[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --junitxml=.agentsphere/reports/junit.xml"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/scenarios"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

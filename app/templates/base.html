<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}OpsBoard{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <!-- Sidebar -->
  <nav class="sidebar" data-testid="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-logo" data-testid="sidebar-logo">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect width="20" height="20" rx="4" fill="var(--color-primary)"/>
        <path d="M4 10h12M10 4v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      OpsBoard
    </div>
    <ul class="sidebar-nav" role="list">
      <li>
        <a href="/dashboard" data-testid="nav-dashboard" aria-label="Dashboard">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="6" height="6" rx="1" fill="currentColor"/>
            <rect x="9" y="1" width="6" height="6" rx="1" fill="currentColor"/>
            <rect x="1" y="9" width="6" height="6" rx="1" fill="currentColor"/>
            <rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor"/>
          </svg>
          Dashboard
        </a>
      </li>
      <li>
        <a href="/services" data-testid="nav-services" aria-label="Services">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2"/>
            <circle cx="8" cy="8" r="2" fill="currentColor"/>
          </svg>
          Services
        </a>
      </li>
      <li>
        <a href="/incidents" data-testid="nav-incidents" aria-label="Incidents">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1L15 13H1L8 1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M8 6v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="11.5" r="0.75" fill="currentColor"/>
          </svg>
          Incidents
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar overlay for mobile -->
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <div class="layout" id="layout">
    <header class="topbar" data-testid="topbar" role="banner">
      <!-- Sidebar toggle button (visible on mobile, hidden on desktop) -->
      <button
        id="sidebar-toggle"
        data-testid="sidebar-toggle"
        class="sidebar-toggle"
        aria-label="Toggle sidebar navigation"
        aria-expanded="false"
        aria-controls="sidebar"
        type="button"
      >
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <span class="page-title" data-testid="page-title">{% block page_title %}OpsBoard{% endblock %}</span>

      <div class="topbar-actions">
        <!-- Global search -->
        <label for="global-search" class="sr-only">Global search</label>
        <input
          id="global-search"
          data-testid="global-search"
          type="search"
          class="global-search"
          placeholder="Search…"
          aria-label="Global search"
        />

        <!-- Theme toggle -->
        <button
          id="theme-toggle"
          data-testid="theme-toggle"
          class="theme-toggle"
          aria-label="Toggle dark mode"
          type="button"
        >
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.5 10A6 6 0 016 2.5a6 6 0 100 11 6 6 0 007.5-3.5z" fill="currentColor"/>
          </svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="3" fill="currentColor"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="content" data-testid="main-content" id="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
